name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - runner: windows-latest
            target: windows
            arch: x64
            ext: '.exe'
          # Windows x86 (32-bit) - 使用 Python 3.10
          - runner: windows-latest
            target: windows
            arch: x86
            ext: '.exe'
          # Linux x64
          - runner: ubuntu-latest
            target: linux
            arch: x64
            ext: ''
          # Linux ARM64 - 使用 ubuntu-22.04
          - runner: ubuntu-22.04
            target: linux
            arch: arm64
            ext: ''
          # macOS x64 (Intel)
          - runner: macos-13
            target: macos
            arch: x64
            ext: ''
          # macOS ARM64 (Apple Silicon)
          - runner: macos-latest
            target: macos
            arch: arm64
            ext: ''

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller (Windows)
      if: matrix.target == 'windows'
      run: |
        pyinstaller --onefile --name edge_tts_web_${{ matrix.target }}_${{ matrix.arch }}${{ matrix.ext }} main.py

    - name: Build with PyInstaller (Linux/macOS)
      if: matrix.target != 'windows'
      run: |
        pyinstaller --onefile --name edge_tts_web_${{ matrix.target }}_${{ matrix.arch }} main.py

    - name: Package application (Windows)
      if: matrix.target == 'windows'
      run: |
        mkdir release_package
        copy dist\edge_tts_web_${{ matrix.target }}_${{ matrix.arch }}${{ matrix.ext }} release_package\
        xcopy templates release_package\templates\ /E /I
        xcopy mp3 release_package\mp3\ /E /I
        copy voices.json release_package\
        copy requirements.txt release_package\
        copy README.md release_package\
        cd release_package
        7z a ..\edge_tts_web_${{ matrix.target }}_${{ matrix.arch }}.zip *
      shell: cmd

    - name: Package application (Linux/macOS)
      if: matrix.target != 'windows'
      run: |
        mkdir -p release_package
        cp dist/edge_tts_web_${{ matrix.target }}_${{ matrix.arch }} release_package/
        cp -r templates release_package/
        cp -r mp3 release_package/
        cp voices.json release_package/
        cp requirements.txt release_package/
        cp README.md release_package/
        cd release_package
        tar -czf ../edge_tts_web_${{ matrix.target }}_${{ matrix.arch }}.tar.gz *

    - name: Upload artifact (Windows)
      if: matrix.target == 'windows'
      uses: actions/upload-artifact@v4
      with:
        name: edge_tts_web_${{ matrix.target }}_${{ matrix.arch }}
        path: edge_tts_web_${{ matrix.target }}_${{ matrix.arch }}.zip

    - name: Upload artifact (Linux/macOS)
      if: matrix.target != 'windows'
      uses: actions/upload-artifact@v4
      with:
        name: edge_tts_web_${{ matrix.target }}_${{ matrix.arch }}
        path: edge_tts_web_${{ matrix.target }}_${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: List artifacts
      run: ls -la artifacts/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        files: artifacts/*
        draft: false
        prerelease: false
        generate_release_notes: true
        tag_name: ${{ github.event.inputs.version || github.ref_name }}
        name: Release ${{ github.event.inputs.version || github.ref_name }}
        body: |
          ## Edge TTS Web ${{ github.event.inputs.version || github.ref_name }}
          
          ### 下载说明
          请根据您的操作系统选择对应的版本：
          
          #### Windows
          - **Windows x64 (64位)**: `edge_tts_web_windows_x64.zip` - 推荐，适用于大多数现代 Windows 系统
          - **Windows x86 (32位)**: `edge_tts_web_windows_x86.zip` - 适用于老旧 32 位系统
          
          #### Linux
          - **Linux x64 (64位)**: `edge_tts_web_linux_x64.tar.gz` - 适用于标准 PC/服务器
          - **Linux ARM64**: `edge_tts_web_linux_arm64.tar.gz` - 适用于树莓派、ARM 服务器
          
          #### macOS
          - **macOS x64 (Intel)**: `edge_tts_web_macos_x64.tar.gz` - 适用于 Intel 芯片 Mac（2019年及之前）
          - **macOS ARM64 (Apple Silicon)**: `edge_tts_web_macos_arm64.tar.gz` - 适用于 M1/M2/M3/M4 芯片 Mac
          
          ### 使用方法
          1. 下载对应平台的压缩包
          2. 解压到任意目录
          3. 运行可执行文件
          4. 打开浏览器访问 `http://localhost:8000`
          
          ### 功能特性
          - 🌍 支持75种语言
          - 🎙️ 322+种音源
          - 🚀 完全免费，无需API密钥
          - 🎨 多语言界面
          - ⚡ 语速调节
          - 🎧 在线试听
          - 📥 下载功能
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
