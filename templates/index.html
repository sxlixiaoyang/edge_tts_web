                "威尔士语": "वेल्श", "巴斯克语": "बास्क", "普什图语": "पश्तो", "库尔德语": "कुर्द",
                "达里语": "दारी", "索马里语": "सोमाली", "斯瓦希里语": "स्वाहिली", "祖鲁语": "ज़ुलु",
                "阿姆哈拉语": "अम्हारिक", "因纽特语": "इनुक्टिटुट", "爪哇语": "जावानी", "巽他语": "सुंडानी",
                "菲律宾语": "फिलिपिनो", "蒙古语": "मंगोलियाई", "马耳他语": "माल्टीज़"
            }
        };

        function populateLanguages() {
            var $langSelect = $("#language");
            $langSelect.empty();
            $langSelect.append(`<option value="">${translations[currentLang].select_language}</option>`);
            
            var sortedLanguages = Object.keys(voicesData).sort();
            if (sortedLanguages.includes("中文")) {
                sortedLanguages = ["中文"].concat(sortedLanguages.filter(l => l !== "中文"));
            }
            
            var nameMap = langNameMap[currentLang] || langNameMap['zh'];
            
            $.each(sortedLanguages, function(index, lang) {
                var voiceCount = 0;
                $.each(voicesData[lang], function(region, voices) {
                    voiceCount += voices.length;
                });
                var displayName = nameMap[lang] || lang;
                $langSelect.append(`<option value="${lang}">${displayName} (${voiceCount})</option>`);
            });
        }
        
        function populateVoices(language) {
            var $voiceSelect = $("#voice");
            $voiceSelect.empty();
            $voiceSelect.append(`<option value="">${translations[currentLang].select_voice}</option>`);
            
            if (!language || !voicesData[language]) {
                return;
            }
            
            var regions = voicesData[language];
            $.each(regions, function(region, voices) {
                var $optgroup = $(`<optgroup label="${region}"></optgroup>`);
                $.each(voices, function(index, voice) {
                    var genderClass = voice.gender === "男" ? "male" : "female";
                    $optgroup.append(`<option value="${voice.name}">${voice.display_name} <span class="voice-tag ${genderClass}">${voice.gender}</span></option>`);
                });
                $voiceSelect.append($optgroup);
            });
        }
        
        $("#language").on("change", function() {
            var selectedLang = $(this).val();
            populateVoices(selectedLang);
        });
        
        $("#synthesize-button").on("click", function(event) {
            var text = $("#text").val().trim();
            var voice = $("#voice").val();
            var t = translations[currentLang];
            
            if (!text) {
                alert(t.alert_no_text);
                return;
            }
            if (!voice) {
                alert(t.alert_no_voice);
                return;
            }
            
            $(this).prop("disabled", true).text("...");
            requestSynthesis();
        });
        
        $("#play-button").on("click", function(event) {
            var t = translations[currentLang];
            if (isPlaying) {
                audio.pause();
                audio.currentTime = 0;
                isPlaying = false;
                $("#play-button").text(t.play_btn);
                $("#progress-container").slideUp();
            } else {
                audio.play();
                isPlaying = true;
                $("#play-button").text("Stop");
                $("#progress-container").slideDown();

                audio.addEventListener("timeupdate", function () {
                    var progress = (audio.currentTime / audio.duration) * 100;
                    $("#progress-bar").css("width", progress + "%").attr("aria-valuenow", progress);
                });

                audio.addEventListener("ended", function () {
                    isPlaying = false;
                    $("#play-button").text(t.play_btn);
                    $("#progress-container").slideUp();
                    $("#progress-bar").css("width", 0 + "%").attr("aria-valuenow", 0);
                });
            }
        });

        function requestSynthesis() {
            var t = translations[currentLang];
            var form_data = {
                'text': $("#text").val(),
                'voice': $("#voice").val(),
                'rate': $("#rate").val()
            };
            
            $.ajax({
                url: "/synthesize",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(form_data),
                success: function(response){
                    var download_link = response['download_link'];
                    $("#download-link").html(`<a href="${download_link}" class="btn btn-success" download>${t.download_btn}</a>`).show();
                    audio = new Audio(download_link);
                    isPlaying = false;
                    $("#synthesize-button").prop("disabled", false).text(t.synthesize_btn);
                    $("#play-button").show().text(t.play_btn);
                    audio.addEventListener("ended", function () {
                        isPlaying = false;
                        $("#play-button").text(t.play_btn);
                    });
                },
                error: function(xhr, status, error) {
                    alert(t.alert_error + error);
                    $("#synthesize-button").prop("disabled", false).text(t.synthesize_btn);
                }
            });
        }
    </script>
</body>
</html>
