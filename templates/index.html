                select_language: "-- भाषा चुनें --",
                select_voice: "-- कृपया पहले भाषा चुनें --",
                normal: "सामान्य",

                footer: "&copy; 22 अप्रैल 2023 <a href='https://www.openai.com/' style='color: #333; text-decoration: none;'>ChatGPT</a> · 75 भाषाएं समर्थित",
                alert_no_text: "कृपया आवाज में बदलने के लिए टेक्स्ट दर्ज करें!",
                alert_no_voice: "कृपया आवाज चुनें!",
                alert_error: "संश्लेषण विफल, कृपया बाद में पुनः प्रयास करें! त्रुटि: ",

        let currentLang = localStorage.getItem('tts-lang') || 'zh';

        // 切换语言下拉菜单
        function toggleLangDropdown() {
            document.getElementById('lang-dropdown').classList.toggle('show');
        }

        // 切换语言
        function switchLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('tts-lang', lang);
            updateUI();
            document.getElementById('lang-dropdown').classList.remove('show');
        }

        // 更新界面
        function updateUI() {
            const t = translations[currentLang];
            
            // 更新文本
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.innerHTML = t[key];
                }
            });

            // 更新placeholder
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) {
                    el.placeholder = t[key];
                }
            });

            // 更新当前语言显示
            document.getElementById('current-lang').textContent = t.current_lang;

            // 更新下拉菜单选中状态
            document.querySelectorAll('.lang-option').forEach(el => {
                el.classList.remove('active');
                if (el.getAttribute('data-lang') === currentLang) {
                    el.classList.add('active');
                }
            });

            // 更新按钮文本
            document.getElementById('synthesize-button').textContent = t.synthesize_btn;
            const playBtn = document.getElementById('play-button');
            if (!isPlaying) {
                playBtn.textContent = t.play_btn;
            }
        }

        // 点击外部关闭下拉菜单
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.lang-switcher')) {
                document.getElementById('lang-dropdown').classList.remove('show');
            }
        });

        var audio;
        var isPlaying = false;
        var voicesData = {};
        
        // 页面加载时初始化
        $(document).ready(function() {
            updateUI();
            loadVoices();
        });
        
        function loadVoices() {
            $.ajax({
                url: "/api/voices",
                type: "GET",
                success: function(response) {
                    if (response.message === "success") {
                        voicesData = response.voices;
                        populateLanguages();
                    }
                },
                error: function() {
                    loadDefaultVoices();
                }
            });
        }
        
        function loadDefaultVoices() {
            var defaultVoices = {
                "中文": {
                    "zh-CN": [
                        {name: "zh-CN-XiaoxiaoNeural", gender: "女", display_name: "小小"},
                        {name: "zh-CN-XiaoyiNeural", gender: "女", display_name: "小逸"},
                        {name: "zh-CN-YunjianNeural", gender: "男", display_name: "云剑"},
                        {name: "zh-CN-YunxiNeural", gender: "男", display_name: "云希"},
                        {name: "zh-CN-YunxiaNeural", gender: "男", display_name: "云夏"},
                        {name: "zh-CN-YunyangNeural", gender: "男", display_name: "云阳"},
                        {name: "zh-CN-liaoning-XiaobeiNeural", gender: "女", display_name: "辽宁小贝"},
                        {name: "zh-CN-shaanxi-XiaoniNeural", gender: "女", display_name: "陕西小妮"}
                    ],
                    "zh-HK": [
                        {name: "zh-HK-HiuGaaiNeural", gender: "女", display_name: "香港卓嘉"},
                        {name: "zh-HK-HiuMaanNeural", gender: "女", display_name: "香港卓萌"},
                        {name: "zh-HK-WanLungNeural", gender: "男", display_name: "香港万隆"}
                    ],
                    "zh-TW": [
                        {name: "zh-TW-HsiaoChenNeural", gender: "女", display_name: "台湾小陈"},
                        {name: "zh-TW-HsiaoYuNeural", gender: "女", display_name: "台湾小雨"},
                        {name: "zh-TW-YunJheNeural", gender: "男", display_name: "台湾云哲"}
                    ]
                }
            };
            voicesData = defaultVoices;
            populateLanguages();
        }
        
        function populateLanguages() {
            var $langSelect = $("#language");
            $langSelect.empty();
            $langSelect.append(`<option value="">${translations[currentLang].select_language}</option>`);
            
            var sortedLanguages = Object.keys(voicesData).sort();
            if (sortedLanguages.includes("中文")) {
                sortedLanguages = ["中文"].concat(sortedLanguages.filter(l => l !== "中文"));
            }
            
            $.each(sortedLanguages, function(index, lang) {
                var voiceCount = 0;
                $.each(voicesData[lang], function(region, voices) {
                    voiceCount += voices.length;
                });
                $langSelect.append(`<option value="${lang}">${lang} (${voiceCount})</option>`);
            });
        }
        
        function populateVoices(language) {
            var $voiceSelect = $("#voice");
            $voiceSelect.empty();
            $voiceSelect.append(`<option value="">${translations[currentLang].select_voice}</option>`);
            
            if (!language || !voicesData[language]) {
                return;
            }
            
            var regions = voicesData[language];
            $.each(regions, function(region, voices) {
                var $optgroup = $(`<optgroup label="${region}"></optgroup>`);
                $.each(voices, function(index, voice) {
                    var genderClass = voice.gender === "男" ? "male" : "female";
                    $optgroup.append(`<option value="${voice.name}">${voice.display_name} <span class="voice-tag ${genderClass}">${voice.gender}</span></option>`);
                });
                $voiceSelect.append($optgroup);
            });
        }
        
        $("#language").on("change", function() {
            var selectedLang = $(this).val();
            populateVoices(selectedLang);
        });
        
        $("#synthesize-button").on("click", function(event) {
            var text = $("#text").val().trim();
            var voice = $("#voice").val();
            var t = translations[currentLang];
            
            if (!text) {
                alert(t.alert_no_text);
                return;
            }
            if (!voice) {
                alert(t.alert_no_voice);
                return;
            }
            
            $(this).prop("disabled", true).text("...");
            requestSynthesis();
        });
        
        $("#play-button").on("click", function(event) {
            var t = translations[currentLang];
            if (isPlaying) {
                audio.pause();
                audio.currentTime = 0;
                isPlaying = false;
                $("#play-button").text(t.play_btn);
                $("#progress-container").slideUp();
            } else {
                audio.play();
                isPlaying = true;
                $("#play-button").text("Stop");
                $("#progress-container").slideDown();

                audio.addEventListener("timeupdate", function () {
                    var progress = (audio.currentTime / audio.duration) * 100;
                    $("#progress-bar").css("width", progress + "%").attr("aria-valuenow", progress);
                });

                audio.addEventListener("ended", function () {
                    isPlaying = false;
                    $("#play-button").text(t.play_btn);
                    $("#progress-container").slideUp();
                    $("#progress-bar").css("width", 0 + "%").attr("aria-valuenow", 0);
                });
            }
        });

        function requestSynthesis() {
            var t = translations[currentLang];
            var form_data = {
                'text': $("#text").val(),
                'voice': $("#voice").val(),
                'rate': $("#rate").val()
            };
            
            $.ajax({
                url: "/synthesize",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(form_data),
                success: function(response){
                    var download_link = response['download_link'];
                    $("#download-link").html(`<a href="${download_link}" class="btn btn-success" download>${t.download_btn}</a>`).show();
                    audio = new Audio(download_link);
                    isPlaying = false;
                    $("#synthesize-button").prop("disabled", false).text(t.synthesize_btn);
                    $("#play-button").show().text(t.play_btn);
                    audio.addEventListener("ended", function () {
                        isPlaying = false;
                        $("#play-button").text(t.play_btn);
                    });
                },
                error: function(xhr, status, error) {
                    alert(t.alert_error + error);
                    $("#synthesize-button").prop("disabled", false).text(t.synthesize_btn);
                }
            });
        }
    </script>
</body>
</html>
